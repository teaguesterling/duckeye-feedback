name: Request
description: A feature or a file type you want duckeye to have.
labels: [request]
body:
  - type: textarea
    id: request
    attributes:
      label: What you want, and why
      description: What would you use it for?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: duckeye version (optional)
